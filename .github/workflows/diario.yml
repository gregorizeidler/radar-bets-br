name: diario

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: testes
        run: python3 tests/test_analise.py
      - name: coleta
        env:
          MAX: "2500"
        run: python3 run.py --max "$MAX" --workers 40
      - name: publica
        run: |
          git config user.name "radar-bets-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "varredura $(date -u +%F)"
          git push
